[project]
name = "molecular-toxicity-deep-learning"
version = "0.1.0"
description = "Predicting small-molecule toxicity from chemical structure with deep learning, using the Tox21 dataset from MoleculeNet."
readme = "README.md"
authors = [
    { name = "jamesmeadows7", email = "james.w.meadows@durham.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "polars>=2.0.0",
    "pyyaml>=6.0.3",
    "rdkit>=2026.9.1",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torch-geometric>=2.8.1",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tox21"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:`torch.jit.script` is deprecated:FutureWarning",
]
