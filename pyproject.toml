[project]
name = "molecular-toxicity-deep-learning"
version = "0.1.0"
description = "Deep learning models for toxicity prediction on Tox21."
readme = "README.md"
authors = [
    { name = "jamesmeadows7", email = "james.w.meadows@durham.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "polars>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tox21"
